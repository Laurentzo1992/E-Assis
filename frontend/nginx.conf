# Sert le bundle React statique. try_files avec repli sur index.html : indispensable pour
# React Router (routes cote client comme /Dashboard, /paiement/retour) - sans ca, un rechargement
# de page ou un lien direct sur une de ces routes renverrait un 404 nginx (le fichier
# /Dashboard/index.html n'existe pas sur le disque, seul index.html sait le router cote client).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers hashes (build/static/js/main.<hash>.js) : cache long, le nom change a chaque
    # nouveau build donc jamais de contenu perime servi depuis le cache.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
