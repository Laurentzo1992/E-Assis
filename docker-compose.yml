services:

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: kbbot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: kbbot-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: kbbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Frontend React (CRA, dev server) - conteneurise pour ne plus dependre d'un process npm start
  # natif lance a la main (qui s'arrete silencieusement avec le terminal/la session qui l'a lance,
  # sans redemarrage automatique - contrairement aux services ci-dessus deja tous en conteneur).
  frontend:
    image: kbbot-frontend:local
    pull_policy: build
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: kbbot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      WDS_SOCKET_PORT: "0"
      # react-scripts 5 (webpack 5) utilise watchpack, pas chokidar, pour surveiller les fichiers -
      # CHOKIDAR_USEPOLLING (defini dans le Dockerfile) ne le concerne pas ; sans cette variable,
      # aucun changement de fichier sur le volume monte depuis Windows n'etait detecte.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Volume anonyme : masque le node_modules monte depuis l'hote (installe pour Windows) par
      # celui installe dans l'image (Linux) - des paquets ont des binaires natifs specifiques a
      # l'OS, les melanger casserait le demarrage.
      - /app/node_modules
    networks:
      - backend

  # Backend FastAPI "entreprises" (auth + module Entreprise + marches publics) - integre depuis
  # le projet E-Assis (Django/DRF d'origine remplace par FastAPI, meme contrat d'API pour
  # frontend, integre lui aussi dans kbbot, qui pointe vers ce service via son port hote 8000).
  api:
    image: kbbot-api:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: kbbot-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./llm_service:/app/llm_service
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  ingest:
    image: kbbot-ingest:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.ingest
    container_name: kbbot-ingest
    depends_on:
      - qdrant
      - minio
      - postgres
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      # extract_bulletin.py / match_and_alert.py (api.scripts.*) uniquement - le reste de ce
      # conteneur (ingestion.*) ne touche jamais a Postgres.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - .:/app
      - ingest_model_cache:/root/.cache
    networks:
      - backend
    # outil en ligne de commande, pas un service de fond : docker compose run --rm ingest ...
    profiles:
      - tools

networks:
  backend:
    name: kbbot_backend

volumes:
  minio_data:
  qdrant_data:
  postgres_data:
  ingest_model_cache:
