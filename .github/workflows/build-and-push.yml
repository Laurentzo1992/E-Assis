name: Build et publie les images (GHCR)

# Construit les 3 images de production (api, ingest, frontend) a chaque push sur main et les
# publie sur GitHub Container Registry - le VPS n'a alors plus qu'a les "pull", sans jamais
# recompiler torch/embeddings localement (le plus long a construire, cf. Dockerfile.ingest).
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "ingestion/**"
      - "llm_service/**"
      - "frontend/**"
      - "Dockerfile.api"
      - "Dockerfile.ingest"
      - "requirements*.txt"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # Minuscules obligatoires pour GHCR - ${{ github.repository_owner }} est "Laurentzo1992".
  OWNER: laurentzo1992

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: kbbot-api
            dockerfile: Dockerfile.api
            context: .
          - image: kbbot-ingest
            dockerfile: Dockerfile.ingest
            context: .
          - image: kbbot-frontend
            dockerfile: frontend/Dockerfile.prod
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # REACT_APP_API_URL inline dans le bundle au build (cf. frontend/src/config.js) - a
          # adapter si le domaine change. Sans effet sur les images api/ingest (build-arg ignore).
          build-args: |
            REACT_APP_API_URL=https://kbot.logo-services.com
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
