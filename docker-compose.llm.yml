services:

  ollama:
    image: ollama/ollama:latest
    container_name: kbbot-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    # necessite un GPU NVIDIA pour des temps de reponse raisonnables (partage avec vision-ocr,
    # cf. docker-compose.yml - ne pas demarrer les deux services GPU simultanement sans verifier
    # la VRAM disponible sur la carte). Demarrage explicite :
    #   docker compose -f docker-compose.llm.yml --profile gpu up -d ollama
    # Puis telecharger le modele une fois :
    #   docker exec kbbot-ollama ollama pull mistral:7b
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    volumes:
      # poids du modele telecharge (~4.4 Go) : evite de re-telecharger a chaque redemarrage
      - ollama_model_cache:/root/.ollama
    networks:
      - backend

  # Variante CPU, memes commandes que "ollama" mais sans reservation GPU - reproduit exactement
  # le mode de fonctionnement de la prod VPS (CPU-only, cf. project_deployment_infra). Utilisee
  # aussi en dev quand le GPU local est deja sature par autre chose (constate en reel : ~11 Go/12
  # Go de VRAM deja pris sans process GPU-lourd identifiable, empechant de charger un modele 9+ Go
  # dessus) ou pour eviter l'instabilite de l'installation Ollama native Windows (modeles
  # disparaissant silencieusement de "ollama list" entre deux sessions sans commande de suppression
  # explicite, constate deux fois le meme jour). Meme port (11434) que "ollama" - ne jamais lancer
  # les deux profils en meme temps (conflit de port).
  #   docker compose -f docker-compose.llm.yml --profile cpu up -d ollama-cpu
  #   docker exec kbbot-ollama-cpu ollama pull mistral:7b
  ollama-cpu:
    image: ollama/ollama:latest
    container_name: kbbot-ollama-cpu
    restart: unless-stopped
    ports:
      - "11434:11434"
    profiles:
      - cpu
    volumes:
      - ollama_model_cache:/root/.ollama
    networks:
      - backend

networks:
  backend:
    external: true
    name: kbbot_backend

volumes:
  ollama_model_cache:
